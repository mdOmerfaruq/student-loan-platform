<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowdfunding</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #0059b3;
      color: white;
      padding: 15px 0;
      text-align: center;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      background-color: #004080;
    }

    nav ul li {
      margin: 0 10px;
    }

    nav ul li a {
      display: block;
      padding: 10px 15px;
      text-decoration: none;
      color: white;
    }

    nav ul li a:hover {
      background-color: #003366;
      border-radius: 4px;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      margin-top: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    #campaignForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    #campaignForm input {
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #campaignForm button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
    }

    #campaignForm button:hover {
      background-color: #0056b3;
    }

    #campaignList {
      list-style: none;
      padding: 0;
    }

    #campaignList li {
      background-color: #f9f9f9;
      margin-bottom: 10px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Crowdfunding Campaigns</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="loan-request.html">Loan Request</a></li>
      <li><a href="loan-offers.html">Loan Offers</a></li>
      <li><a href="crowdfunding.html">Crowdfunding</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Sign Up</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <form id="campaignForm">
      <input type="text" id="campaignTitle" placeholder="Campaign Title" required>
      <input type="text" id="campaignDesc" placeholder="Description" required>
      <input type="number" id="campaignGoal" placeholder="Goal Amount (tk)" required>
      <button type="submit">Create Campaign</button>
    </form>

    <ul id="campaignList"></ul>
  </main>

  <script src="js/script-crowdfunding.js"></script>
</body>
</html>
