<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css">

<body>
  <header>

    <nav>

        <li><a href="signup.html">Sign Up</a></li>

    </nav>
  </header>
  <main>
    <form action="login.php" method="POST" class="form-box">

    </form>
