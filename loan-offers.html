<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Offers</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #0059b3;
      color: white;
      padding: 15px 0;
      text-align: center;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      background-color: #004080;
    }

    nav ul li {
      margin: 0 10px;
    }

    nav ul li a {
      display: block;
      padding: 10px 15px;
      text-decoration: none;
      color: white;
    }

    nav ul li a:hover {
      background-color: #003366;
      border-radius: 4px;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    #loanRequests {
      list-style: none;
      padding: 0;
      margin-bottom: 20px;
    }

    #loanRequests li {
      background-color: #f9f9f9;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }

    #offerForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #offerForm input {
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #offerForm button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
    }

    #offerForm button:hover {
      background-color: #0056b3;
    }

    #selectedOfferInfo {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: #444;
    }
  </style>
</head>
<body>

  <header>
    <h1>Loan Offers</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="loan-request.html">Loan Request</a></li>
      <li><a href="loan-offers.html">Loan Offers</a></li>
      <li><a href="crowdfunding.html">Crowdfunding</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Sign Up</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <ul id="loanRequests"></ul>

    <form id="offerForm">
      <input type="text" id="lenderName" placeholder="Your Name" required>
      <input type="number" id="offerAmount" placeholder="Offer Amount" required>
      <input type="number" id="interestRate" placeholder="Interest Rate (%)" required>
      <button type="submit">Submit Offer</button>
    </form>

    <div id="selectedOfferInfo"></div>
  </main>

  <script src="js/script-offers.js"></script>
</body>
</html>
