<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Request</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #0059b3;
      color: white;
      padding: 15px 0;
      text-align: center;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      background-color: #004080;
    }

    nav ul li {
      margin: 0 10px;
    }

    nav ul li a {
      display: block;
      padding: 10px 15px;
      text-decoration: none;
      color: white;
    }

    nav ul li a:hover {
      background-color: #003366;
      border-radius: 4px;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    #loanForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #loanForm input {
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #loanForm button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
    }

    #loanForm button:hover {
      background-color: #0056b3;
    }

    #loanMessage {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <header>
    <h1>Loan Request Page</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="loan-request.html">Loan Request</a></li>
      <li><a href="loan-offers.html">Loan Offers</a></li>
      <li><a href="crowdfunding.html">Crowdfunding</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Sign Up</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <form id="loanForm">
  <input type="text" id="borrowerName" placeholder="Your Name" required>
  <input type="text" id="loanAmount" placeholder="Loan Amount" inputmode="numeric" pattern="[0-9]*" required>
  <button type="submit">Submit Loan Request</button>
</form
    <p id="loanMessage"></p>
  </main>

  <script src="js/script-request.js"></script>
</body>
</html>
